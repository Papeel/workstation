# ── General ────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0          # sin retardo en <Esc> (importante para nvim)
set -g focus-events on         # autoread de nvim
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# ── Prefijo: Ctrl+a ───────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recargado"

# Splits y ventanas nuevas en el directorio actual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Redimensionar con prefijo + H/J/K/L (repetible)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Atajos sin prefijo (antes en Ghostty)
bind -n M-v split-window -h -c "#{pane_current_path}"   # Alt+v: split a la derecha
bind -n M-d split-window -v -c "#{pane_current_path}"   # Alt+d: split abajo
bind -n M-h select-pane -L                               # Alt+h/j/k/l: moverse entre paneles
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# Ctrl+Shift+h/j/k/l en Ghostty llega como Alt+Shift+h/j/k/l
bind -n M-H resize-pane -L 10
bind -n M-J resize-pane -U 10
bind -n M-K resize-pane -D 10
bind -n M-L resize-pane -R 10

# Copy mode estilo vi
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Plugins (TPM) ─────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'   # Ctrl+h/j/k/l entre tmux y nvim
set -g @plugin 'tmux-plugins/tmux-resurrect'      # guardar/restaurar sesiones
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# ── Barra de estado / pestañas (colores de tu tema de Ghostty) ──
set -g status-position top
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=default,fg=#f3f6f9"
set -g status-left-length 40
set -g status-right-length 60
setw -g window-status-separator " "

# Nombre automático: la carpeta si estás en la shell, si no el programa (nvim, npm…)
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"
setw -g monitor-activity on
set -g visual-activity off

# Sesión (cambia a rosa mientras el prefijo está pulsado)
set -g status-left "#[fg=#{?client_prefix,#cb7c94,#7fb4ca}]#[bg=#{?client_prefix,#cb7c94,#7fb4ca},fg=#06080f,bold] #S#[bg=default,fg=#{?client_prefix,#cb7c94,#7fb4ca}]  "

# Pestaña inactiva
setw -g window-status-format "#[fg=#161b2e]#[bg=#161b2e,fg=#8a8fa3]#I #W#{?window_activity_flag, #[fg=#e0c15a],}#[bg=default,fg=#161b2e]"
# Pestaña activa: número resaltado + nombre
setw -g window-status-current-format "#[fg=#e0c15a]#[bg=#e0c15a,fg=#06080f,bold]#I #[bg=#263356,fg=#f3f6f9,bold] #W#{?window_zoomed_flag, 󰊓,}#[bg=default,fg=#263356]"

set -g status-right "#[fg=#161b2e]#[bg=#161b2e,fg=#8a8fa3] %H:%M#[bg=default,fg=#161b2e] #[fg=#7fb4ca]#[bg=#7fb4ca,fg=#06080f,bold]#h#[bg=default,fg=#7fb4ca]"

set -g pane-border-style "fg=#263356"
set -g pane-active-border-style "fg=#7fb4ca"
set -g pane-border-lines heavy
set -g message-style "bg=#263356,fg=#f3f6f9"
setw -g mode-style "bg=#263356,fg=#e0c15a"

run '~/.tmux/plugins/tpm/tpm'
